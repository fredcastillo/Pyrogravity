# docker compose --env-file .env.connection -f docker-compose.yml -f compose.ai.yml up --build -d
services:
  api:
    env_file: ["${BACKEND_ENV_FILE:?Ruta al archivo privado del backend}"]
    environment:
      DEMO_MODE: "false"
      AI_PROVIDER_ENABLED: "true"
      AI_INTERNAL_URL: https://ai-gateway:8443
      SSL_CERT_FILE: /certs/ca-bundle.pem
    volumes:
      - ${AI_TLS_CERT_DIR:?Directorio privado de certificados}:/certs:ro
    networks: [default, ai_private]
    depends_on: [ai-gateway]
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    env_file: ["${AI_ENV_FILE:?Ruta al archivo privado de IA}"]
    networks: [default, ai_private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  ai-gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    volumes:
      - ./infrastructure/local/ai-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AI_TLS_CERT_DIR:?Directorio privado de certificados}:/certs:ro
    networks: [ai_private]
    depends_on: [ai]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    build:
      args:
        VITE_AI_DEMO_MODE: "false"
networks:
  ai_private:
    internal: true
