AWSTemplateFormatVersion: '2010-09-09'
Description: Pyrogravity operational alerts and a lightweight public availability probe.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: EventBridge probes CloudFront and its API; CloudWatch alerts through SNS.
    must:
      - No credentials are required to probe public NASA data.
      - Email subscribers must confirm their SNS subscription.
Parameters:
  SiteUrl:
    Type: String
    AllowedPattern: 'https://[a-z0-9]+\.cloudfront\.net'
  ApiId:
    Type: String
    AllowedPattern: '[a-z0-9]+'
  FunctionName:
    Type: String
    AllowedPattern: '[a-zA-Z0-9-_]+'
  AlertEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
Resources:
  Alerts:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: Send operational failure and recovery notifications to the project contact.
        must:
          - Only AWS alarms and authorized account operators publish here.
    Properties:
      DisplayName: Pyrogravity operations
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Alerts
      Protocol: email
      Endpoint: !Ref AlertEmail
  AlertPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'
          - Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  ProbeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-probe'
      RetentionInDays: 14
  ProbeRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: The public probe emits metrics through its own structured logs.
        must:
          - No application secrets, deployment rights or database access.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProbeLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ProbeLogs.Arn
  Probe:
    Type: AWS::Lambda::Function
    DependsOn: ProbeLogs
    Metadata:
      com.aws.cloudformation.Context:
        why: Verify the actual public page and API even when nobody visits the demo.
        must:
          - Failure or missing probe metrics must raise an availability alarm.
    Properties:
      FunctionName: !Sub '${AWS::StackName}-probe'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ProbeRole.Arn
      MemorySize: 128
      Timeout: 45
      Environment:
        Variables:
          SITE_URL: !Ref SiteUrl
      Code:
        ZipFile: |
          import json, os, time
          from urllib.request import urlopen
          def handler(event, context):
              ok = 0
              try:
                  with urlopen(os.environ['SITE_URL'] + '/', timeout=10) as r:
                      assert r.status == 200 and b'PYROGRAVITY' in r.read()
                  with urlopen(os.environ['SITE_URL'] + '/api/v1/health', timeout=10) as r:
                      assert json.load(r)['status'] == 'ok'
                  with urlopen(os.environ['SITE_URL'] + '/api/v1/analyses', timeout=10) as r:
                      assert len(json.load(r)) == 5
                  ok = 1
              except Exception as e:
                  print(json.dumps({'probe_error': type(e).__name__, 'request_id': context.aws_request_id}))
              print(json.dumps({'_aws': {'Timestamp': int(time.time()*1000), 'CloudWatchMetrics': [
                  {'Namespace': 'Pyrogravity/Demo', 'Dimensions': [['Service']],
                   'Metrics': [{'Name': 'Available', 'Unit': 'Count'}]}]},
                  'Service': 'public-demo', 'Available': ok}))
              return {'available': ok}
  ProbeSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: Probe
          Arn: !GetAtt Probe.Arn
          RetryPolicy: {MaximumRetryAttempts: 1, MaximumEventAgeInSeconds: 120}
  ProbePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Probe
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProbeSchedule.Arn
      SourceAccount: !Ref AWS::AccountId
  Availability:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Public page, API health or science catalog unavailable for two checks; missing probes also alert.
      Namespace: Pyrogravity/Demo
      MetricName: Available
      Dimensions: [{Name: Service, Value: public-demo}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least three HTTP 5xx responses in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref ApiId}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  ApiLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API p95 latency exceeds three seconds for two periods.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions: [{Name: ApiId, Value: !Ref ApiId}]
      ExtendedStatistic: p95
      EvaluateLowSampleCountPercentile: ignore
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  ApiClientErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least twenty HTTP 4xx responses in five minutes; inspect request IDs and route keys.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions: [{Name: ApiId, Value: !Ref ApiId}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  LambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API Lambda failed at least once in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref FunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  LambdaThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda concurrency throttled at least once in five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref FunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
Outputs:
  AlertTopicArn:
    Value: !Ref Alerts
  ProbeFunction:
    Value: !Ref Probe
