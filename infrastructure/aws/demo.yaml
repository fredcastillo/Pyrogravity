AWSTemplateFormatVersion: '2010-09-09'
Description: Public Pyrogravity science demo with a private S3 origin and an HTTP API.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: README.md
    arch: CloudFront fronts the dashboard and the Lambda comparison API.
    must:
      - The demo publishes public NASA measurements only and needs no external credentials.

Parameters:
  ArtifactBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  ArtifactKey:
    Type: String
    AllowedPattern: 'lambda/[a-f0-9]{64}\.zip'
  ArtifactSha256:
    Type: String
    AllowedPattern: '[A-Za-z0-9+/]{43}='

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores the published frontend and recoverable previous versions.
        must:
          - Serve the bucket through OAC and keep all public access blocks enabled.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldFrontendVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadPublishedFrontend
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: The demo reads an included snapshot and needs only log writes.
        must:
          - Scope writes to the demo log group.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: WriteApiLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:log-stream:*'

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: A Python ZIP runs the public demo without provisioning a container registry or a VPC.
        must:
          - The package hash identifies the source data and code used by the alias.
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Role: !GetAtt ApiRole.Arn
      Runtime: python3.12
      Handler: app.handler
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 10
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey

  ApiVersion:
    Type: AWS::Lambda::Version
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ApiFunction
      CodeSha256: !Ref ArtifactSha256

  ApiAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ApiFunction
      FunctionVersion: !GetAtt ApiVersion.Version
      Name: demo

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http'
      ProtocolType: HTTP

  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Metadata:
      com.aws.cloudformation.Context:
        why: Correlate public API requests without storing query strings or user content.
        must:
          - Keep access logs bounded by retention and include the Gateway request ID.
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt HttpAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationStatus":"$context.integrationStatus"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  HttpAccessLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Trace HTTP status and integration failures independently of Lambda logs.
        must:
          - Do not record request bodies, authorization headers or query strings.
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/apigateway/${AWS::StackName}'
      RetentionInDays: 14

  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref ApiAlias
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 12000

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/v1/health'
      Target: !Sub 'integrations/${HttpIntegration}'

  DatasetsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/v1/datasets'
      Target: !Sub 'integrations/${HttpIntegration}'

  CompareRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/v1/compare'
      Target: !Sub 'integrations/${HttpIntegration}'

  AnalysesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/v1/analyses'
      Target: !Sub 'integrations/${HttpIntegration}'

  AnalysisRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/v1/analyses/{analysis_id}'
      Target: !Sub 'integrations/${HttpIntegration}'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiAlias
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/$default/GET/api/v1/*'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: One HTTPS URL serves the UI and forwards its API calls.
        must:
          - Forward queries to API Gateway and skip caching for API requests.
          - Use OAC on the private S3 origin.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} science demo'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: http-api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          Compress: true
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: http-api
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SiteUrl:
    Description: Public HTTPS URL for the demo and its API.
    Value: !Sub 'https://${Distribution.DomainName}'
  SiteBucketName:
    Description: Private bucket that receives the frontend files.
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution to invalidate after publishing.
    Value: !Ref Distribution
  HttpApiUrl:
    Description: HTTP API base URL for diagnosis and release checks.
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionAliasArn:
    Description: ARN of the Lambda release alias invoked by HTTP API.
    Value: !Ref ApiAlias
