services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=7).close()"]
      interval: 5s
      timeout: 8s
      start_period: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/local/frontend.Dockerfile
      args:
        VITE_AI_DEMO_MODE: "${PYRO_DEV_AI_DEMO_MODE:-true}"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 8s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
