[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrogravity-ai"
version = "0.1.0"
description = "Scientific AI engine for Pyrogravity"
requires-python = ">=3.12"
dependencies = [
    "cohere==7.3.1",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "psycopg[binary]==3.3.9",
    "pypdf==7.0.0",
    "fonttools==4.68.0",
    "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
